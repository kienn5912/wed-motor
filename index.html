<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thông số kỹ thuật motor</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#111}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd;padding:10px}
h1{margin:0 0 9px;text-align:center;font-size:22px}.bar{display:flex;gap:7px;flex-wrap:wrap;max-width:1400px;margin:auto}
button,input,textarea,select{font:inherit}button{border:1px solid #aaa;background:#fff;color:#111;border-radius:8px;padding:8px 11px;cursor:pointer}
button:hover{background:#f3f3f3}input[type=search]{flex:1;min-width:190px;padding:8px;border:1px solid #bbb;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:12px;max-width:1500px;margin:auto}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:9px;min-height:260px;cursor:pointer;box-shadow:0 1px 3px #0001}
.card:hover{border-color:#777}.num{font-weight:bold;text-align:center;margin-bottom:7px}
.spec{display:grid;grid-template-columns:90px 10px 1fr;gap:4px 2px;font-size:13px}.colon{text-align:center}.value{overflow-wrap:anywhere}
.thumb{width:100%;height:95px;object-fit:contain;border:1px dashed #bbb;border-radius:7px;margin-top:7px}
.cardtools{display:flex;gap:5px;margin-top:7px}.cardtools button{flex:1;padding:6px;font-size:12px}
.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:12px;z-index:50}
.modal.show{display:flex}.box{background:#fff;border-radius:12px;padding:15px;width:min(650px,100%);max-height:94vh;overflow:auto}
.formrow{display:grid;grid-template-columns:120px 12px 1fr;gap:4px;margin:6px 0;align-items:center}.formrow input,.formrow textarea{width:100%;padding:8px;border:1px solid #bbb;border-radius:7px}
.preview{max-width:100%;max-height:220px;display:block;margin:8px auto;border-radius:8px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.small{font-size:12px;color:#666}.status{text-align:center;font-size:12px;color:#666;margin-top:5px}
#papers{max-width:1200px;margin:auto;padding:10px}.paperbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.paperWrap{background:#ddd;padding:8px;border-radius:10px;overflow:auto}.paperStage{position:relative;width:min(100%,900px);margin:auto}
#paperCanvas{display:block;width:100%;height:auto;background:#fff;border:1px solid #aaa;touch-action:none}
#paperOverlay{position:absolute;inset:0;pointer-events:none}
.toolOn{background:#111;color:#fff}.pageInfo{padding:8px 4px;font-weight:bold}
#photoEdit{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:60;padding:12px}
.photoBox{background:#fff;border-radius:12px;padding:12px;width:min(900px,100%);max-height:94vh;overflow:auto}
.photoCanvasWrap{background:#eee;overflow:auto;text-align:center}.photoCanvas{max-width:100%;height:auto}
</style>
</head>
<body>
<header>
<h1>⚙️ THÔNG SỐ KỸ THUẬT MOTOR</h1>
<div class="bar">
<button id="motorTab">⚙️ Motor</button>
<button id="paperTab">📄 100 trang giấy</button>
<input id="search" type="search" placeholder="Tìm motor theo số hoặc thông số...">
<button id="reload">↻ Tải lại</button>
</div>
<div id="status" class="status"></div>
</header>

<main id="motorPage"><div id="grid" class="grid"></div></main>

<section id="paperPage" class="hidden">
<div id="papers">
<div class="paperbar">
<button id="prev">← Trước</button><span id="pageTitle" class="pageInfo">Trang 1 / 100</span><button id="next">Sau →</button>
<button id="pen" class="toolOn">✏️ Bút</button>
<button id="line">╱ Đường</button>
<button id="eraser">⌫ Tẩy</button>
<button id="undo">↶ Hoàn tác</button>
<button id="clear">🗑️ Xóa</button>
<button id="savePaper">💾 Lưu</button>
<label><button type="button">📷 Thêm ảnh</button><input id="paperPhoto" type="file" accept="image/*" capture="environment" class="hidden"></label>
<button id="copyPaper">📋 Sao chép trang</button>
</div>
<div class="paperWrap"><div class="paperStage"><canvas id="paperCanvas" width="1200" height="1600"></canvas></div></div>
<p class="small">Trang giấy dùng chung online. Có thể vẽ, kẻ đường, tẩy, hoàn tác, thêm ảnh rồi lưu. Khi lưu, mọi người mở web sẽ thấy trang đó.</p>
</div>
</section>

<div id="modal" class="modal">
<div class="box">
<h2 id="modalTitle">MOTOR</h2><div id="form"></div><div id="photoArea"></div>
<div class="actions">
<button id="saveMotor">💾 Lưu</button>
<label><button type="button">📷 Chụp/đổi ảnh</button><input id="motorPhoto" type="file" accept="image/*" capture="environment" class="hidden"></label>
<button id="deletePhoto">Xóa ảnh</button><button id="closeModal">Đóng</button>
</div><p class="small">Ảnh được nén trước khi lưu. Bấm vào ảnh để xem lớn.</p>
</div></div>

<div id="photoEdit">
<div class="photoBox">
<h3>Xem / chỉnh ảnh MOTOR <span id="photoMotorNo"></span></h3>
<div class="photoCanvasWrap"><canvas id="photoCanvas" class="photoCanvas"></canvas></div>
<div class="actions">
<label><button type="button">📷 Thay ảnh</button><input id="replacePhoto" type="file" accept="image/*" capture="environment" class="hidden"></label>
<button id="photoRotate">↻ Xoay</button><button id="photoSave">💾 Lưu ảnh</button><button id="photoClose">Đóng</button>
</div>
</div></div>

<script>
const SUPABASE_URL="https://wrnlazzqhsfitbpruwcb.supabase.co";
const SUPABASE_KEY="sb_publishable_eLXVAyuPn3MLYv4dQGO5Fw_K9x0sALa";
const db=SUPABASE_KEY.startsWith("DAN_")?null:supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const fields=[
["ten_motor","Tên MOTOR"],["tua","Tua (P)"],["kieu_dau","Kiểu Đấu"],["a","A"],
["so_vong","Số Vòng"],["duong_kinh","Ø"],["dai","Dài (cm)"],["rong","Rộng (cm)"],
["ghi_chu","Ghi chú"],["cong","Cộng"]
];
let motors=Array.from({length:1000},(_,i)=>({id:i+1})),currentId=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function msg(t){$("status").textContent=t}
function makeCard(m){
 const d=document.createElement("div");d.className="card";d.dataset.id=m.id;
 d.innerHTML=`<div class="num">MOTOR ${m.id}</div><div class="spec">${fields.map(f=>`<div>${f[1]}</div><div class="colon">:</div><div class="value">${esc(m[f[0]]||"")}</div>`).join("")}</div>
 ${m.anh?`<img class="thumb" src="${m.anh}" alt="Ảnh motor ${m.id}">`:""}
 <div class="cardtools"><button class="editBtn">✏️ Sửa</button><button class="cameraBtn">📷 Ảnh</button></div>`;
 d.onclick=e=>{if(!e.target.closest("button")&&!e.target.closest("img"))openMotor(m.id)};
 d.querySelector(".editBtn").onclick=e=>{e.stopPropagation();openMotor(m.id)};
 d.querySelector(".cameraBtn").onclick=e=>{e.stopPropagation();pickMotorPhoto(m.id)};
 d.querySelector(".thumb")?.addEventListener("click",e=>{e.stopPropagation();showPhoto(m.id)});
 return d;
}
function render(){
 const q=$("search").value.toLowerCase().trim(),g=$("grid");g.innerHTML="";
 motors.filter(m=>!q||fields.some(f=>String(m[f[0]]||"").toLowerCase().includes(q))||String(m.id).includes(q))
 .forEach(m=>g.appendChild(makeCard(m)));
}
async function loadMotors(){
 if(!db){msg("Chưa kết nối Supabase");render();return}
 msg("Đang tải dữ liệu...");
 const {data,error}=await db.from("motors").select("*").order("id");
 if(error){msg("Lỗi tải dữ liệu: "+error.message);render();return}
 data?.forEach(x=>{if(x.id>=1&&x.id<=1000)motors[x.id-1]={...motors[x.id-1],...x}});
 msg("Đã đồng bộ dữ liệu");render();
}
function openMotor(id){
 currentId=id;const m=motors[id-1];$("modalTitle").textContent="MOTOR "+id;
 $("form").innerHTML=fields.map(f=>`<div class="formrow"><label>${f[1]}</label><span>:</span><input data-key="${f[0]}" value="${esc(m[f[0]]||"")}"></div>`).join("");
 $("photoArea").innerHTML=m.anh?`<img class="preview" src="${m.anh}" alt="Ảnh motor ${id}">`:"<p class='small'>Chưa có ảnh.</p>";
 $("modal").classList.add("show");
 $("photoArea").querySelector(".preview")?.addEventListener("click",()=>showPhoto(id));
}
async function saveMotor(){
 const m=motors[currentId-1];document.querySelectorAll("#form input").forEach(i=>m[i.dataset.key]=i.value);
 if(!db){alert("Chưa kết nối Supabase.");return}
 const {error}=await db.from("motors").upsert(m,{onConflict:"id"});
 if(error){alert("Lỗi lưu: "+error.message);return}
 $("modal").classList.remove("show");msg("Đã lưu MOTOR "+currentId);render();
}
function compress(file,max=1200,q=.72){
 return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
 let w=im.width,h=im.height;if(w>max){h*=max/w;w=max}if(h>max){w*=max/h;h=max}
 const c=document.createElement("canvas");c.width=Math.round(w);c.height=Math.round(h);c.getContext("2d").drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",q))
 };im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})
}
async function pickMotorPhoto(id){
 currentId=id;const inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.capture="environment";
 inp.onchange=async e=>{if(!e.target.files[0])return;const data=await compress(e.target.files[0]);motors[id-1].anh=data;
 if(db){const {error}=await db.from("motors").upsert(motors[id-1],{onConflict:"id"});if(error){alert(error.message);return}}
 render();openMotor(id);msg("Đã lưu ảnh MOTOR "+id)};
 inp.click();
}
$("motorPhoto").onchange=async e=>{if(e.target.files[0]&&currentId){motors[currentId-1].anh=await compress(e.target.files[0]);openMotor(currentId)}};
$("saveMotor").onclick=saveMotor;
$("closeModal").onclick=()=>$("modal").classList.remove("show");
$("deletePhoto").onclick=async()=>{if(!currentId)return;motors[currentId-1].anh=null;if(db)await db.from("motors").update({anh:null}).eq("id",currentId);openMotor(currentId);render()};
$("search").oninput=render;$("reload").onclick=loadMotors;

function showPhoto(id){
 const src=motors[id-1]?.anh;if(!src)return;
 photoId=id;const im=new Image();im.onload=()=>{photoImg=im;drawPhoto()};im.src=src;$("photoMotorNo").textContent=id;$("photoEdit").style.display="flex";
}
let photoId=null,photoImg=null,photoAngle=0;
function drawPhoto(){
 if(!photoImg)return;const c=$("photoCanvas"),ctx=c.getContext("2d"),swap=Math.abs(photoAngle)%180===90;
 c.width=swap?photoImg.height:photoImg.width;c.height=swap?photoImg.width:photoImg.height;
 ctx.save();ctx.translate(c.width/2,c.height/2);ctx.rotate(photoAngle*Math.PI/180);ctx.drawImage(photoImg,-photoImg.width/2,-photoImg.height/2);ctx.restore();
}
$("photoRotate").onclick=()=>{photoAngle=(photoAngle+90)%360;drawPhoto()};
$("photoClose").onclick=()=>$("photoEdit").style.display="none";
$("replacePhoto").onchange=async e=>{if(e.target.files[0]){const d=await compress(e.target.files[0]);const im=new Image();im.onload=()=>{photoImg=im;photoAngle=0;drawPhoto()};im.src=d}};
$("photoSave").onclick=async()=>{const data=$("photoCanvas").toDataURL("image/jpeg",.72);motors[photoId-1].anh=data;if(db){const {error}=await db.from("motors").upsert(motors[photoId-1],{onConflict:"id"});if(error){alert(error.message);return}}$("photoEdit").style.display="none";render();msg("Đã cập nhật ảnh MOTOR "+photoId)};

$("motorTab").onclick=()=>{$("motorPage").classList.remove("hidden");$("paperPage").classList.add("hidden")};
$("paperTab").onclick=()=>{$("motorPage").classList.add("hidden");$("paperPage").classList.remove("hidden");loadPaper()};

const canvas=$("paperCanvas"),ctx=canvas.getContext("2d");let page=1,drawing=false,tool="pen",sx=0,sy=0,lastImage=null,history=[];
function blank(){ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height)}
blank();
function saveHistory(){history.push(canvas.toDataURL("image/png"));if(history.length>15)history.shift()}
function restoreData(data){const im=new Image();im.onload=()=>{blank();ctx.drawImage(im,0,0,canvas.width,canvas.height)};im.src=data}
function pos(e){const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*canvas.width/r.width,y:(p.clientY-r.top)*canvas.height/r.height}}
function start(e){drawing=true;saveHistory();const p=pos(e);sx=p.x;sy=p.y;ctx.beginPath();ctx.moveTo(sx,sy);e.preventDefault()}
function move(e){if(!drawing)return;const p=pos(e);if(tool==="pen"){ctx.strokeStyle="#111";ctx.lineWidth=3;ctx.lineCap="round";ctx.lineTo(p.x,p.y);ctx.stroke()}else if(tool==="eraser"){ctx.strokeStyle="#fff";ctx.lineWidth=28;ctx.lineCap="round";ctx.lineTo(p.x,p.y);ctx.stroke()}e.preventDefault()}
function end(e){if(!drawing)return;drawing=false;if(tool==="line"){const p=pos(e);ctx.strokeStyle="#111";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(p.x,p.y);ctx.stroke()} }
canvas.addEventListener("mousedown",start);canvas.addEventListener("mousemove",move);canvas.addEventListener("mouseup",end);canvas.addEventListener("mouseleave",()=>drawing=false);
canvas.addEventListener("touchstart",start,{passive:false});canvas.addEventListener("touchmove",move,{passive:false});canvas.addEventListener("touchend",end);
function setTool(t){tool=t;["pen","line","eraser"].forEach(x=>$ (x).classList.remove("toolOn"));$(t).classList.add("toolOn")}
$("pen").onclick=()=>setTool("pen");$("line").onclick=()=>setTool("line");$("eraser").onclick=()=>setTool("eraser");
$("undo").onclick=()=>{if(history.length){restoreData(history.pop())}};
$("clear").onclick=()=>{saveHistory();blank()};
function label(){$("pageTitle").textContent=`Trang ${page} / 100`}
async function loadPaper(){
 label();blank();history=[];
 if(!db){msg("Chưa kết nối Supabase");return}
 const {data,error}=await db.from("papers").select("content").eq("id",page).maybeSingle();
 if(error){msg("Lỗi tải trang: "+error.message);return}
 if(data?.content){restoreData(data.content)}
 msg("Đã tải trang "+page);
}
$("prev").onclick=async()=>{if(page>1){page--;await loadPaper()}};
$("next").onclick=async()=>{if(page<100){page++;await loadPaper()}};
$("savePaper").onclick=async()=>{if(!db){alert("Chưa kết nối Supabase.");return}const content=canvas.toDataURL("image/jpeg",.78);const {error}=await db.from("papers").upsert({id:page,content},{onConflict:"id"});if(error)alert("Lỗi lưu: "+error.message);else msg("Đã lưu trang "+page)};
$("paperPhoto").onchange=async e=>{if(!e.target.files[0])return;saveHistory();const data=await compress(e.target.files[0]);const im=new Image();im.onload=()=>{const scale=Math.min(canvas.width/im.width,canvas.height/im.height);const w=im.width*scale,h=im.height*scale;ctx.drawImage(im,(canvas.width-w)/2,(canvas.height-h)/2,w,h)};im.src=data;e.target.value=""};
$("copyPaper").onclick=async()=>{try{const blob=await new Promise(r=>canvas.toBlob(r,"image/png"));await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);msg("Đã sao chép trang vào bộ nhớ tạm")}catch(e){alert("Trình duyệt không hỗ trợ sao chép ảnh.")}};

loadMotors();
</script>
</body></html>
