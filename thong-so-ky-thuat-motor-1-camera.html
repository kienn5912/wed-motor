<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thông số kỹ thuật motor</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f2f2;color:#222}
header{background:#222;color:#fff;text-align:center;padding:22px 10px}
h1{margin:0 0 16px;font-size:24px}
#search{width:90%;max-width:600px;padding:12px;border:0;border-radius:7px;font-size:16px;outline:none}
.container{max-width:1100px;margin:20px auto;padding:0 10px}
#result{margin-bottom:12px;font-weight:bold}
#pages{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.motor-box{position:relative;background:#fff;border-radius:8px;aspect-ratio:1/1;padding:12px;box-shadow:0 2px 7px rgba(0,0,0,.08);overflow:hidden}
.motor-form{font-size:12px;line-height:1.9}
.motor-row{display:flex;align-items:center;white-space:nowrap;min-height:22px}
.motor-label{width:85px;flex:0 0 85px}
.motor-input{width:65px;height:20px;padding:1px 3px;border:0;border-bottom:1px solid rgba(0,0,0,.2);background:transparent;outline:none;font-size:12px}
.motor-input:focus{border-bottom-color:rgba(0,0,0,.45)}
.photo-btn{position:absolute;right:10px;bottom:9px;width:30px;height:30px;padding:0;border:0;border-radius:6px;background:#eee;cursor:pointer;font-size:17px}
.photo-btn:hover{background:#ddd}
.photo-file{display:none}
.photo-preview{position:absolute;right:45px;bottom:9px;width:30px;height:30px;object-fit:cover;border-radius:6px;border:1px solid #ddd}
.hidden{display:none}
@media(max-width:700px){
#pages{grid-template-columns:repeat(2,1fr);gap:7px}
.motor-box{padding:9px}
.motor-form{font-size:11px;line-height:1.85}
.motor-label{width:74px;flex-basis:74px}
.motor-input{width:55px;font-size:11px}
h1{font-size:19px}
.photo-btn{right:8px;bottom:8px}
}
</style>
</head>
<body>
<header>
<h1>⚙️ THÔNG SỐ KỸ THUẬT MOTOR</h1>
<input id="search" type="text" placeholder="🔎 Gõ thông tin cần tìm...">
</header>
<div class="container">
<div id="result">Đang hiển thị 500 ô</div>
<div id="pages"></div>
</div>
<script>
const pages=document.getElementById("pages");
const search=document.getElementById("search");
const result=document.getElementById("result");
const fields=[
["Tên MOTOR","ten"],["Tua (P)","tua"],["Kiểu Đấu","kieu"],["A","a"],
["Số Vòng","vong"],["Ø","duongkinh"],["Dài (cm)","dai"],["Rộng (cm)","rong"],["Ghi chú","ghichu"]
];
const inputs=[];
const photos={};

for(let i=0;i<500;i++){
  const box=document.createElement("div");
  box.className="motor-box";
  const form=document.createElement("div");
  form.className="motor-form";

  fields.forEach(([label,key])=>{
    const row=document.createElement("div");
    row.className="motor-row";

    const labelEl=document.createElement("span");
    labelEl.className="motor-label";
    labelEl.textContent=label+" :";

    const input=document.createElement("input");
    input.className="motor-input";
    input.type="text";
    input.dataset.box=i;
    input.dataset.field=key;

    row.append(labelEl,input);
    form.appendChild(row);
    inputs.push(input);
  });

  const photoBtn=document.createElement("button");
  photoBtn.type="button";
  photoBtn.className="photo-btn";
  photoBtn.textContent="📷";
  photoBtn.title="Chụp / chọn ảnh";

  const photoFile=document.createElement("input");
  photoFile.type="file";
  photoFile.accept="image/*";
  photoFile.capture="environment";
  photoFile.className="photo-file";

  const photoPreview=document.createElement("img");
  photoPreview.className="photo-preview";
  photoPreview.style.display="none";

  photoBtn.onclick=()=>photoFile.click();

  photoFile.onchange=()=>{
    const file=photoFile.files && photoFile.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>{
      photoPreview.src=e.target.result;
      photoPreview.style.display="block";
      photos[i]=e.target.result;
      saveData();
    };
    reader.readAsDataURL(file);
  };

  box.append(form,photoBtn,photoFile,photoPreview);
  pages.appendChild(box);
}

function saveData(){
  const data={};
  inputs.forEach(input=>{
    const b=input.dataset.box;
    const f=input.dataset.field;
    if(!data[b])data[b]={};
    data[b][f]=input.value;
  });
  localStorage.setItem("motorData",JSON.stringify(data));
  localStorage.setItem("motorPhotos",JSON.stringify(photos));
}

function loadData(){
  try{
    const data=JSON.parse(localStorage.getItem("motorData")||"{}");
    inputs.forEach(input=>{
      const b=input.dataset.box,f=input.dataset.field;
      if(data[b] && data[b][f]!==undefined)input.value=data[b][f];
    });
    const savedPhotos=JSON.parse(localStorage.getItem("motorPhotos")||"{}");
    Object.assign(photos,savedPhotos);
    document.querySelectorAll(".motor-box").forEach((box,i)=>{
      if(photos[i]){
        const img=box.querySelector(".photo-preview");
        img.src=photos[i];
        img.style.display="block";
      }
    });
  }catch(e){}
}

function searchMotors(){
  const keyword=search.value.toLowerCase().trim();
  const boxes=document.querySelectorAll(".motor-box");
  let found=0;
  boxes.forEach(box=>{
    const text=Array.from(box.querySelectorAll("input[type=text]"))
      .map(x=>x.value).join(" ").toLowerCase();
    const labels=box.querySelector(".motor-form").innerText.toLowerCase();
    const ok=!keyword||text.includes(keyword)||labels.includes(keyword);
    box.classList.toggle("hidden",!ok);
    if(ok)found++;
  });
  result.textContent=keyword?`Tìm thấy ${found} ô`:"Đang hiển thị 500 ô";
}

document.addEventListener("input",e=>{
  if(e.target.classList.contains("motor-input"))saveData();
  if(e.target===search)searchMotors();
});
loadData();
</script>
</body>
</html>
